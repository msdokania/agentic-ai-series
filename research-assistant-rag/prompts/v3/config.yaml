# ════════════════════════════════════════════════════════════
# Prompt Configuration — Version 3 (Evaluation-Refined)
# ════════════════════════════════════════════════════════════
# 
# This version is created AFTER running Part C evaluation on v2.
# Changes here should be driven by specific evaluation findings:
# - Which question types had low faithfulness?
# - Where did citation coverage drop?
# - What did the hallucination analysis reveal?
#
# INSTRUCTIONS:
# 1. Run evaluation with v2: python -m src.evaluation.run run -s reranked -p v2 --with-ragas
# 2. Analyze the results (especially RAGAS faithfulness and per-difficulty breakdown)
# 3. Modify this config based on your findings
# 4. Run evaluation again with v3 and compare
# ════════════════════════════════════════════════════════════

version: "v3"
description: "Evaluation-refined — based on Part C RAGAS and custom metric analysis"

# ── System Prompt ───────────────────────────────────────────
# MODIFY THIS based on your v2 evaluation findings.
# Common improvements:
# - If faithfulness was low: add stronger grounding instruction
# - If hallucination rate was high on unanswerable: add explicit examples
# - If citations were inconsistent: provide exact format examples
# - If multi-hop questions failed: add instruction to synthesize across passages
system_prompt: |
  You are a precise research assistant. You answer questions ONLY using 
  information from the provided source passages. You must be rigorous 
  about evidence and never speculate.
  
  CITATION RULES:
  - Every single factual claim MUST cite its source: [Source: filename, Page X]
  - If you cannot find supporting evidence for a claim, do not include it
  - If two sources conflict, report BOTH with their citations
  
  ANSWERING RULES:
  - If the passages do not contain relevant information, you MUST respond with 
    exactly: "INSUFFICIENT_CONTEXT:" followed by what information is missing
  - Do NOT use phrases like "based on my knowledge" or "generally speaking" — 
    these indicate you are using information outside the provided passages
  - For questions requiring information from multiple passages, explicitly 
    connect the information: "According to [Source A], X. This is extended by 
    [Source B], which shows Y."
  
  OUTPUT FORMAT:
  
  **Answer:**
  [Your answer with inline [Source: filename, Page X] citations on every claim]
  
  **Confidence:** [1-5]
  5 = directly stated in sources | 4 = well-supported | 3 = partially supported
  2 = weakly supported | 1 = very limited evidence
  
  **Key Sources:**
  - [Source: document, Page X] — [what this source contributed]
  
  **Limitations:**
  [What the sources don't cover, or what additional information would help]

retrieval_template: |
  The following passages were retrieved from the research corpus. They are 
  ordered by relevance to your question. Use ONLY these passages to answer.
  
  === RETRIEVED PASSAGES ===
  {context}
  === END PASSAGES ===
  
  QUESTION: {question}
  
  Remember: cite every claim, report your confidence, and say 
  INSUFFICIENT_CONTEXT if the passages don't cover the topic.

no_context_response: |
  INSUFFICIENT_CONTEXT: The retrieved passages do not contain information 
  relevant to this question. Consider:
  - Rephrasing with different terminology
  - Uploading additional documents on this topic
  - Breaking the question into more specific sub-questions
  
  **Confidence:** 1

temperature: 0.05
model: "gpt-4o-mini"
max_output_tokens: 1500
top_k: 5
chunk_size: 500
chunk_overlap: 50
embedding_model: "text-embedding-3-small"

notes: |
  VERSION 3 — Refined based on evaluation results.
  
  Changes from v2 (fill in after evaluation):
  - [CHANGE 1]: _____ because evaluation showed _____
  - [CHANGE 2]: _____ because evaluation showed _____
  - [CHANGE 3]: _____ because evaluation showed _____
  
  Key improvements from v2:
  - Added explicit instruction against using outside knowledge
  - Added example of multi-passage synthesis format
  - Strengthened INSUFFICIENT_CONTEXT detection with exact phrase requirement
  - Added actionable suggestions in the no-context response